<!doctype html>

<html lang="en">

  <head>

    <title>Page not found - Claimore</title>

    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">

    <style>

      *, *::before, *::after {
        box-sizing: border-box;
      }

      * {
        margin: 0;
      }

      html {
        font-size: 16px;
      }

      body {
        background: #F8FAFC;
        color: #0F172A;
        display: grid;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        min-height: 100dvh;
        place-items: center;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }

      main {
        display: grid;
        gap: 1.5rem;
        justify-items: center;
        padding: 2rem;
        text-align: center;
      }

      .badge {
        align-items: center;
        background: #F0ECFF;
        border-radius: 1.25rem;
        color: #6D4AFF;
        display: grid;
        font-size: 2.5rem;
        font-weight: 800;
        height: 5rem;
        justify-content: center;
        letter-spacing: -0.02em;
        width: 5rem;
      }

      h1 {
        font-size: clamp(1.5rem, 3vw, 2rem);
        font-weight: 700;
      }

      p {
        color: #475569;
        font-size: 1.05rem;
        line-height: 1.5;
        max-width: 30em;
      }

      a.button {
        background: #6D4AFF;
        border-radius: 0.75rem;
        color: #FFFFFF;
        font-weight: 600;
        padding: 0.75rem 1.5rem;
        text-decoration: none;
      }

      a.button:hover {
        background: #5835E5;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0F172A;
          color: #F1F5F9;
        }

        p {
          color: #94A3B8;
        }
      }

    </style>

  </head>

  <body>

    <!-- This file lives in public/404.html -->

    <main>
      <div class="badge">404</div>
      <h1>We couldn't find that page</h1>
      <p>The page you're looking for may have moved, or the link might be incorrect. Double-check the address, or head back to your Claimore dashboard.</p>
      <a class="button" href="/">Back to Claimore</a>
    </main>

  </body>

</html>
